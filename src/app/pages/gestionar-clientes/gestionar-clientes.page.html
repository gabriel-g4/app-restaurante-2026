<ion-header [translucent]="false">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="home"></ion-back-button>
    </ion-buttons>
    <ion-title class="ion-text-center">Aprobar Clientes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <section id="lista-clientes">

    @if (clientesPendientes.length === 0) {
    <div class="empty-state">
      <ion-icon name="checkmark-circle-outline"></ion-icon>
      <p>No hay clientes pendientes de aprobación.</p>
    </div>
    } @else {
    <div class="clientes-grid">
      @for (cliente of clientesPendientes; track cliente.id) {

      <div class="cliente-card">
        <img [src]="cliente.foto" alt="Foto de {{ cliente.nombre }}" class="cliente-foto" />

        <div class="cliente-info">
          <h3>{{ cliente.apellido }}, {{ cliente.nombre }}</h3>
          <p>DNI: {{ cliente.dni }}</p>
        </div>

        <div class="cliente-actions">
          <ion-button class="btn-rechazar" fill="outline" (click)="confirmarRechazo(cliente)">
            <ion-icon slot="icon-only" name="close"></ion-icon>
          </ion-button>

          <ion-button class="btn-aceptar" (click)="confirmarAceptacion(cliente)">
            <ion-icon slot="icon-only" name="checkmark"></ion-icon>
          </ion-button>
        </div>
      </div>

      }
    </div>
    }

  </section>
</ion-content>
