
<ion-content id="main-content" [fullscreen]="true">
  <div class="container">


    <div class="action-buttons">

      <ion-button expand="block" class="action-button" (click)="accederPedidosPendientes()">
        <div class="contenido-button">
          <img src="assets/imgs/agendar.png" class="icono-personalizado" alt="Agregar empleado" />
          <span>Pedidos pendientes</span>
        </div>
      </ion-button>

      <ion-button type="button" class="action-button" (click)="agregarBebida()">
          <div class="contenido-button">
            <img src="assets/imgs/plato.png" class="icono-personalizado" alt="Agregar bebida" />
            <span>Agregar bebida</span>
          </div>
        </ion-button>

    </div>

  </div>
</ion-content>
