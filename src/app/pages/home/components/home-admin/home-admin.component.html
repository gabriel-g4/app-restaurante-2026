<ion-header class="custom-header">
  <ion-toolbar>
    <ion-title class="header-title"> Administrador </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content id="main-content" [fullscreen]="true">
  <div class="container">

    <div class="action-buttons">
      <ion-button type="button" class="action-button" (click)="agregarEmpleado()">
        <div clase="contenido-button">
          <img src="assets\imgs\agregar_empleado.png" class="icono-personalizado" alt="Agregar" />
          <span>Agregar empleado</span>
        </div>
      </ion-button>
      <ion-button type="button" class="action-button" (click)="agregarMesa()">
        <div clase="contenido-button">
          <img src="assets\imgs\agregar_mesa.png" class="icono-personalizado" alt="Agregar" />
          <span>Agregar mesa</span>
        </div>
      </ion-button>
    </div>

  </div>
</ion-content>
