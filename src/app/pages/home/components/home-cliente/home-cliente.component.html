<div class="action-buttons">

  <ion-button class="action-button" (click)="escanearQR()">
    <div class="contenido-button">
      <ion-icon class="icono-personalizado" name="qr-code-outline"></ion-icon>
      <span>Escanear QR</span>
    </div>
  </ion-button>

  <ion-button class="action-button" (click)="escanearQRDebug()">
    <div class="contenido-button">
      <ion-icon class="icono-personalizado" name="qr-code-outline"></ion-icon>
      <span>Escanear QR DEBUG PC</span>
    </div>
  </ion-button>

  <!-- DEBUG -->
  <ion-button class="action-button" (click)="navegar('juegos')">
    <div class="contenido-button">
      <ion-icon class="icono-personalizado" name="qr-code-outline"></ion-icon>
      <span>Juegos</span>
    </div>
  </ion-button>

</div>

<ion-fab vertical="bottom" horizontal="end" slot="fixed" class="fab-chat">
  <ion-fab-button color="secondary" (click)="irAlChat()">
    <ion-icon name="chatbubbles"></ion-icon>
  </ion-fab-button>
</ion-fab>
