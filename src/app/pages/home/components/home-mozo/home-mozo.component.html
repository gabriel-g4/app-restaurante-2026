<div class="action-buttons">

  <ion-button class="action-button" (click)="navegar('pedidos-mozo')">
    <div class="contenido-button">
      <ion-icon class="icono-personalizado" name="notifications-outline"></ion-icon>
      <span>Ver Pedidos</span>
    </div>
  </ion-button>

  <ion-button class="action-button" (click)="irAlChat()">
    <div class="contenido-button">
      <ion-icon class="icono-personalizado" name="chatbubbles-outline"></ion-icon>
      <span>Consultas de Clientes</span>
    </div>
  </ion-button>


  <ion-button class="action-button" (click)="escanearQR()">
    <div class="contenido-button">
      <ion-icon class="icono-personalizado" name="qr-code-outline"></ion-icon>
      <span>Escanear mesa</span>
    </div>
  </ion-button>



</div>
